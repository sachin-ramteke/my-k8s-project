name: Free K8s CI/CD with KinD

on:
  push:
    branches: [ "main" ]

jobs:
  k8s-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Custom Docker Image
        run: |
          docker build -t my-custom-app:v1 .

      - name: Create KinD Kubernetes Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: test-cluster

      - name: Load Image into KinD Cluster
        run: |
          kind load docker-image my-custom-app:v1 --name test-cluster

      - name: Deploy Custom App to Cluster
        run: |
          kubectl create deployment custom-web --image=my-custom-app:v1
          kubectl rollout status deployment/custom-web

      - name: Verify Running Custom Pods
        run: |
          kubectl get pods -o wide
          
